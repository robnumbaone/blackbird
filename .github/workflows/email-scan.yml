name: Email Scan

on:
  workflow_dispatch:
    inputs:
      email:
        description: Email da cercare
        required: true

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Run Blackbird
        env:
          TARGET_EMAIL: ${{ inputs.email }}
        run: python blackbird.py --email "$TARGET_EMAIL" --csv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: email-results
          path: results/
          if-no-files-found: warn
          
