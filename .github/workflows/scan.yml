name: Username Scan

on:
  workflow_dispatch:
    inputs:
      username:
        description: Username da cercare
        required: true

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Run Blackbird
        env:
          TARGET: ${{ inputs.username }}
        run: python blackbird.py --username "$TARGET" --csv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results
          path: results/
          if-no-files-found: warn
